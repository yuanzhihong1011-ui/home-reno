<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #F4F1EC; 
  --card: #FFFFFF;
  --ink: #3D3A36; 
  --ink2: #736D65;
  --ink3: #A69F96;
  --line: #EBE5DC;
  --wood: #B0957D; 
  --wood-d: #8F7660;
  --green: #8E9F8A; 
  --red: #C48282;   
  --cream: #F0EBE1;
  --r: 16px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;outline:none}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#C5B1A1,#A68F7D);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px;box-shadow:0 4px 12px rgba(166,143,125,.2)}
.bname{font-family:Georgia,"Songti SC",serif;font-size:17px;font-weight:600;letter-spacing:.05em;color:var(--ink)}
.bsub{font-size:9px;letter-spacing:.16em;color:var(--ink3)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:99px;font-size:12.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line);white-space:nowrap;transition:.2s}
.tab.on{background:var(--wood);border-color:var(--wood);color:#fff;font-weight:500;box-shadow:0 4px 10px rgba(176,149,125,.2)}

.hero{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:14px;box-shadow:0 4px 16px rgba(166,143,125,.05)}
.hero .k{font-size:11.5px;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;}
.hero h1{font-family:Georgia,"Songti SC",serif;font-size:26px;letter-spacing:.02em;color:var(--wood-d)}
.hero .meta{font-size:12px;color:var(--ink2);margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--cream);padding:3px 10px;border-radius:99px;font-size:11px;color:var(--ink2)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:16px;transition:.2s;position:relative;box-shadow:0 2px 12px rgba(166,143,125,.04);}
.stat.clickable{cursor:pointer}
.stat.clickable:active{transform:scale(0.98)}
.stat .l{font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;}
.stat .l span{color:var(--wood);font-size:10px;}
.stat .v{font-size:20px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .v.sm{font-size:16px}
.stat .s{font-size:11px;color:var(--ink3);margin-top:4px}
.stat.main{background:linear-gradient(135deg,#A68F7D,#8C7665);color:#fff;grid-column: span 2;box-shadow:0 6px 20px rgba(166,143,125,.2)}
.stat.main .l,.stat.main .s{color:rgba(255,255,255,.75)}
.stat.main .l span{color:#F4F1EC}
.stat.main .v{font-size:26px;color:#fff;}
.stat.acc{background:var(--cream);color:var(--wood-d)}

.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(166,143,125,.04);}
.ct{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.ct::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--wood)}
.ct .r{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--ink3)}

.chart-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.chart-box{position:relative;width:180px;height:180px;flex:0 0 180px}
.chart-info{flex:1;min-width:180px;background:var(--bg);border-radius:14px;padding:16px;text-align:center;transition:.3s;cursor:pointer;position:relative;border:1px solid var(--line);}
.chart-info::after{content:"👆 点击切换数据";position:absolute;bottom:6px;left:0;right:0;font-size:10px;color:var(--ink3);}
.chart-info h4{font-size:14px;color:var(--ink2);margin-bottom:6px}
.chart-info .amt{font-size:22px;font-weight:600;color:var(--wood-d);margin-bottom:4px;font-variant-numeric:tabular-nums}
.chart-info .pct{font-size:11.5px;color:var(--ink3)}
.legend-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;width:100%}
.legend-item{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.2s}
.legend-item:hover{background:var(--bg)}
.legend-left{display:flex;align-items:center;gap:8px}
.legend-color{width:10px;height:10px;border-radius:50%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:500;transition:.2s}
.btn.p{background:var(--wood);color:#fff;box-shadow:0 4px 12px rgba(176,149,125,.2)}
.btn.p:active{transform:scale(0.96)}
.btn.g{background:var(--cream);color:var(--wood-d)}
.btn.t{padding:5px 10px;font-size:12px;border-radius:8px;background:var(--cream);color:var(--ink2)}
.btn.x{padding:5px 10px;font-size:12px;border-radius:8px;background:#F7EAEA;color:var(--red)}

.rec{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;transition:.2s;border:1px solid var(--line);}
.rec:hover{box-shadow:0 4px 16px rgba(166,143,125,.06);border-color:var(--wood)}
.rec .l{flex:1;min-width:0}
.rec .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rec .m{font-size:12px;color:var(--ink3);margin-top:2px}
.rec .r{text-align:right;white-space:nowrap}
.rec .a{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;color:var(--wood-d)}
.rec .st{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--cream);color:var(--ink2);white-space:nowrap}
.ops{display:flex;gap:6px;}

/* 进度卡片 */
.prog-item { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; transition:.2s; }
.prog-item:hover { box-shadow:0 4px 12px rgba(166,143,125,.06); border-color:var(--wood); }
.prog-left { display:flex; flex-direction:column; gap:6px; }
.prog-name { font-size:15px; font-weight:600; color:var(--ink); }
.prog-note { font-size:12px; color:var(--ink3); }
.prog-status { font-size:12px; font-weight:500; padding:4px 12px; border-radius:99px; }
.prog-status.done { background:#E8F0E8; color:var(--green); }
.prog-status.doing { background:var(--cream); color:var(--wood-d); }
.prog-status.todo { background:var(--bg); color:var(--ink3); }

.roomgrid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.room{background:var(--card);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;flex:1 1 calc(33.333% - 10px);min-width:130px;box-shadow:0 2px 8px rgba(166,143,125,.04);border:1px solid var(--line);}
.room:hover{border-color:var(--wood);box-shadow:0 4px 12px rgba(176,149,125,.1)}
.room.on{border:1px solid var(--wood);background:var(--cream)}
.room .rn{font-size:13.5px;font-weight:600;color:var(--ink); display:flex; align-items:center; gap:6px;}
.room .ra{font-size:16px;font-weight:600;color:var(--wood-d);margin-top:4px}
.room .rs{font-size:11px;color:var(--ink3);margin-top:2px}

.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-top:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:100%;}
th{text-align:left;font-weight:500;font-size:12px;color:var(--ink3);padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:14px;border-bottom:1px solid var(--line);color:var(--ink);}
tr:last-child td{border-bottom:none;}
tr:hover td { background: var(--bg); }
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}

.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:90;padding:8px 6px calc(8px + env(safe-area-inset-bottom));align-items:center;justify-content:space-around}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink3);padding:4px 10px;border-radius:12px;transition:.2s}
.bn span{font-size:18px;line-height:1}
.bn.on{color:var(--wood-d);font-weight:600}
.fab{width:48px;height:48px;border-radius:50%;flex:0 0 48px;background:linear-gradient(135deg,#C5B1A1,#A68F7D);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 20px rgba(166,143,125,.3);margin-top:-16px;transition:.2s}

#mask{display:none;position:fixed;inset:0;background:rgba(61,58,54,.4);backdrop-filter:blur(4px);z-index:200}
#mask.on{display:block}
#modal{display:none;position:fixed;z-index:201;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100vw - 24px));max-height:85vh;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(61,58,54,.15)}
#modal.on{display:flex}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.mh h3{font-size:16px;font-weight:600;color:var(--ink)}
.mb{padding:0 20px 10px;overflow-y:auto;flex:1}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px 18px;background:var(--bg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.s2{grid-column:1/-1}
.f>span{font-size:11.5px;color:var(--ink3)}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;transition:.2s;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--wood);background:#fff}
.close{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink3);font-size:13px}

#loginOverlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{background:var(--card);padding:32px 24px;border-radius:20px;box-shadow:0 10px 40px rgba(166,143,125,.1);width:100%;max-width:320px;text-align:center;}
.login-box h2{font-family:Georgia,serif;font-size:22px;margin-bottom:20px;color:var(--wood-d)}
.login-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;margin-bottom:14px;text-align:center;letter-spacing:.2em;background:var(--bg);color:var(--ink)}
.login-box button{width:100%;padding:12px;background:var(--wood);color:#fff;border-radius:12px;font-size:15px;font-weight:600;transition:.2s}
.login-box p{font-size:12px;color:var(--red);margin-top:10px;height:16px;}

.group-title{font-size:13.5px;font-weight:600;color:var(--wood-d);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;}
.group-title:first-child{margin-top:0;}
.group-subtotal{font-size:12px;color:var(--ink3);font-weight:400;}

#confirmModal{display:none;position:fixed;inset:0;z-index:300;align-items:center;justify-content:center;background:rgba(61,58,54,.4);backdrop-filter:blur(4px);}
#confirmModal.on{display:flex;}

.confirm-box h3{font-size:16px;margin-bottom:10px;color:var(--red);}
.confirm-box p{font-size:13px;color:var(--ink2);margin-bottom:20px;line-height:1.6;}
.confirm-box .btns{display:flex;gap:10px;justify-content:center;}

@media(max-width:600px){.form{grid-template-columns:1fr}.stat.main{grid-column:span 2}.chart-wrap{flex-direction:column}.chart-info{width:100%}.room{flex:1 1 calc(50% - 10px);}}
</style>
</head>

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function loadLocal(){try{const r=localStorage.getItem(KEY);return r?Object.assign(def(),JSON.parse(r)):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

async function cloudLoad(){
  if(!db) return null;
  try{
    const { data, error } = await db.from('reno_data').select('content').eq('id', 1).single();
    if (error) throw error;
    return (data && data.content) ? data.content : null;
  }catch(e){ return null; }
}

async function cloudPush(){
  if(!db) return false;
  try{
    const { error } = await db.from('reno_data').update({ content: S }).eq('id', 1);
    return !error;
  }catch(e){ return false; }
}

function save(){
  S.updatedAt=Date.now();
  saveLocal();
  render();
  if(db) {
    toast('⏳ 正在同步云端...');
    cloudPush().then(ok=>{
      if(ok) toast('✅ 云端同步成功');
      else toast('❌ 云端同步失败，已存本地');
    });
  } else {
    toast('💾 已保存到本地');
  }
}

async function cloudRefresh(){
  if(!db){toast('未配置云端，请填 URL 和 Key');return}
  toast('⏳ 正在拉取...');
  const remote=await cloudLoad();
  if(!remote){toast('拉取失败');return}
  if((remote.updatedAt||0)>(S.updatedAt||0)){
    S=Object.assign(def(),remote);
    saveLocal();render();toast('✅ 已同步云端最新数据');
  }else{
    toast('✅ 已是最新');
  }
}

async function init(){
  const local = loadLocal();
  if(local) S = Object.assign(def(), local);
  if(SUPABASE_URL.startsWith('http')){
    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const remote = await cloudLoad();
    if (remote && Object.keys(remote).length > 0) {
      if((remote.updatedAt||0) > (S.updatedAt||0)) {
        S = Object.assign(def(), remote);
      }
    } else {
      if(S.items && S.items.length > 0) await cloudPush();
    }
    db.channel('reno-sync').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'reno_data' },
      payload => { 
        if (payload.new && payload.new.content) { 
          S = payload.new.content; 
          saveLocal(); render(); 
        } 
      }
    ).subscribe();
  }
  saveLocal();
  render();
}

function itemsBy(m){return S.items.filter(i=>i.module===m)}
function paid(i){return num(i.amount) || num(i.paid)} 

function calc(){
  let c=0,p=0,arrived=0,installed=0;
  S.items.forEach(i=>{
    c+=paid(i); 
    p+=paid(i);
    if(i.module === 'appliance') {
      if(i.status.includes('已到货') || i.status.includes('安装中') || i.status.includes('已完成')) arrived++;
      if(i.status.includes('安装中') || i.status.includes('已完成')) installed++;
    }
  });
  const ch=S.changes.reduce((s,x)=>s+num(x.amount),0);
  const total=p+ch;
  return{budget:num(S.budget.total),contract:c,itemsPaid:p,total,changes:ch,remaining:num(S.budget.total)-total,pending:0,arrived,installed}
}

function catPaid(cat){return S.items.filter(i=>cat.mods.includes(i.module)).reduce((s,i)=>s+paid(i),0)}

function drawChart() {
  const canvas = document.getElementById('expenseChart'); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const otherSpent = S.changes.reduce((s,x)=>s+num(x.amount),0);
  
  chartData = S.budget.cats.map(cat => ({ name: cat.name, budget: cat.amount, value: catPaid(cat), color: '', items: S.items.filter(i=>cat.mods.includes(i.module)) }));
  chartData.push({ name: '其他费用', budget: otherSpent, value: otherSpent, color: '', items: S.changes });
  
  const dataToUse = chartMode === 'spent' ? chartData.map(d => d.value) : chartData.map(d => d.budget);
  const totalValue = dataToUse.reduce((s, v) => s + v, 0);
  
  const colors = ['#B0957D', '#8E9F8A', '#889BA8', '#968E9F', '#C48282', '#A69F96'];
  ctx.clearRect(0, 0, 180, 180);
  if (totalValue === 0) return;
  let startAngle = -Math.PI / 2;
  
  chartData.forEach((d, i) => {
    const val = chartMode === 'spent' ? d.value : d.budget;
    if (val === 0) return;
    const sliceAngle = (val / totalValue) * 2 * Math.PI;
    d.color = colors[i % colors.length]; d.startAngle = startAngle; d.endAngle = startAngle + sliceAngle;
    ctx.beginPath(); ctx.moveTo(90, 90); ctx.arc(90, 90, 80, startAngle, startAngle + sliceAngle);
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    startAngle += sliceAngle;
  });
  ctx.beginPath(); ctx.arc(90, 90, 55, 0, Math.PI * 2); ctx.fillStyle = '#F4F1EC'; ctx.fill();
  
  const legend = document.getElementById('legendList');
  legend.innerHTML = chartData.map((d, i) => {
    const val = chartMode === 'spent' ? d.value : d.budget;
    if (val === 0) return '';
    return `
    <div class="legend-item" id="legend-${i}" onclick="showChartInfo(${i})">
      <div class="legend-left"><div class="legend-color" style="background:${d.color}"></div>${d.name}</div>
      <div style="text-align:right"><div style="font-weight:600">${chartMode === 'spent' ? '已花' : '预算'} ${fmt(val)}</div></div>
    </div>`;
  }).join('');
  resetChartInfo();
}

function handleChartClick(e) {
  const canvas = document.getElementById('expenseChart'); if (!canvas || chartData.length === 0) return;
  const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top;
  const dx = x - 90; const dy = y - 90; const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > 55 && dist < 80) {
    let angle = Math.atan2(dy, dx); if (angle < -Math.PI/2) angle += Math.PI * 2;
    for (let i = 0; i < chartData.length; i++) {
      const d = chartData[i]; if (angle >= d.startAngle && angle < d.endAngle) { showChartInfo(i); break; }
    }
  } else { resetChartInfo(); }
}

function showChartInfo(index) {
  const d = chartData[index]; if (!d) return;
  const totalSpent = chartData.reduce((s, item) => s + item.value, 0);
  const totalBudget = chartData.reduce((s, item) => s + item.budget, 0);
  const pct = chartMode === 'spent' ? (totalSpent > 0 ? ((d.value / totalSpent) * 100).toFixed(1) : 0) : (totalBudget > 0 ? ((d.budget / totalBudget) * 100).toFixed(1) : 0);
  
  document.getElementById('chartInfo').innerHTML = `

  document.querySelectorAll('#legendList .legend-item').forEach(el => el.style.background = 'transparent');

}

    <div class="r"><div class="a">${fmt(paid(i))}</div></div><div class="st">${esc(i.status||'已完成')}</div>
    <div class="ops">
      <button class="btn t" onclick="event.stopPropagation(); editItem('${i.id}')">✏️ 编辑</button>
      <button class="btn x" onclick="event.stopPropagation(); delItem('${i.id}')">✕ 删除</button>
    </div>
  </div>`).join('');
  return `<div class="head" style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;"><h2 style="font-size:22px; color:var(--wood-d);">${MODULES[m]}</h2><button class="btn p" onclick="openItem('${m}')">＋ 添加</button></div>
  <div class="mini" style="background:var(--card); border:none; box-shadow:0 2px 12px rgba(166,143,125,.04); padding:14px; display:flex; gap:20px; border-radius:14px;"><div><span style="font-size:11px; color:var(--ink3);">总花费</span><br><b style="font-size:18px;">${fmt(c)}</b></div><div><span style="font-size:11px; color:var(--ink3);">笔数</span><br><b style="font-size:18px;">${l.length}</b></div></div>
  ${filterHTML}<div id="recList">${l.length?rec:`<div class="empty"><span class="e">${MODULES[m]}</span>暂无记录</div>`}</div>`;
}

function filterAppliance(type) {
  document.querySelectorAll('#recList .rec').forEach(r => {
    const status = r.querySelector('.st').innerText; const dataType = r.dataset.type;
    r.style.display = (!type || status.includes(type) || dataType.includes(type)) ? 'flex' : 'none';
  });
}

function progress(){
  const l=S.schedule.map(s=>{
    const cls=s.status==='已完成'?'done':s.status==='进行中'?'doing':'todo';
    return `<div class="prog-item">
      <div class="prog-left">
        <div class="prog-name">${esc(s.name)}</div>
        ${s.note?`<div class="prog-note">${esc(s.note)}</div>`:''}
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="prog-status ${cls}" onclick="editStage('${s.id}')" style="cursor:pointer;">${esc(s.status)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="head" style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;"><h2 style="font-size:22px; color:var(--wood-d);">施工进度</h2><button class="btn p" onclick="addStage()">＋ 阶段</button></div><div>${l}</div>`;
}

function changes(){
  const l=S.changes.map(c=>`<div class="rec" onclick="editChange('${c.id}')"><div class="l"><div class="t">${esc(c.name)}</div><div class="m">${c.payer?'💰'+esc(c.payer):''}</div></div><div class="r"><div class="a">${fmt(c.amount)}</div></div>
  <div class="ops">
    <button class="btn t" onclick="event.stopPropagation(); editChange('${c.id}')">✏️ 编辑</button>
    <button class="btn x" onclick="event.stopPropagation(); delChange('${c.id}')">✕ 删除</button>
  </div></div>`).join('');
  const con=S.changes.reduce((s,c)=>s+num(c.amount),0);
  return `<div class="head" style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;"><h2 style="font-size:22px; color:var(--wood-d);">其他费用</h2><button class="btn p" onclick="addChange()">＋ 费用</button></div><div class="mini" style="background:var(--card); border:none; box-shadow:0 2px 12px rgba(166,143,125,.04); padding:14px; border-radius:14px;"><div><span style="font-size:11px; color:var(--ink3);">总花费</span><br><b style="color:var(--red);font-size:18px;">${fmt(con)}</b></div></div>${S.changes.length?l:`<div class="empty"><span class="e">📝</span>暂无其他费用</div>`}`;
}

function rooms(){
  const map={};
  S.items.forEach(i=>{
    if(i.module === 'house' || i.module === 'labor' || i.room === '全屋' || i.room === '未分类' || !i.room) return; 
    const r=i.room; if(!map[r])map[r]={a:0,p:0,n:0,list:[]};
    map[r].a+=num(i.amount); map[r].p+=paid(i); map[r].n++; map[r].list.push(i);
  });
  const keys=Object.keys(map).sort((a,b)=>map[b].a-map[a].a);
  const cards=keys.map(r=>`<div class="room ${roomFocus===r?'on':''}" onclick="focusRoom('${esc(r)}')">
    <div class="rn">${ROOM_ICONS[r]||'🏷️'} ${esc(r)}</div>
    <div class="ra">${fmt(map[r].a)}</div>
    <div class="rs">共 ${map[r].n} 项</div>
  </div>`).join('');
  let detail='';
  if(roomFocus&&map[roomFocus]){
    const rows=map[roomFocus].list.map(i=>`<tr class="clickable-row" style="cursor:pointer;" onclick="editItem('${i.id}')"><td>${esc(i.name)}</td><td>${MODULES[i.module]}</td><td class="n">${fmt(paid(i))}</td><td>${esc(i.payer||'')}</td></tr>`).join('');
    detail=`<div class="card" style="margin-top:16px"><div class="ct">${ROOM_ICONS[roomFocus]||'🏷️'} ${esc(roomFocus)} 明细</div><div class="tbl"><table><thead><tr><th>项目</th><th>模块</th><th class="n">金额</th><th>付款人</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return `<div class="head" style="margin-bottom:16px;"><h2 style="font-size:22px; color:var(--wood-d);">房间明细</h2></div>${keys.length?`<div class="roomgrid">${cards}</div>`:`<div class="empty"><span class="e">🏠</span>暂无房间数据</div>`}${detail}`;
}

function focusRoom(r){roomFocus=roomFocus===r?null:r;render()}

function field(f){
  const cls=f.span?'f s2':'f',v=f.value??'';
  let input;
  if(f.type==='select')input=`<select name="${f.key}">${f.options.map(o=>{const val=typeof o==='string'?o:o.value,lab=typeof o==='string'?o:o.label;return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')input=`<textarea name="${f.key}" rows="2" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else input=`<input name="${f.key}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'step="any" min="0"':''}>`;
  return `<label class="${cls}"><span>${esc(f.label)}</span>${input}</label>`;
}
function modal(title,fields,onSave){
  const m=document.getElementById('modal'),mask=document.getElementById('mask');
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mform').innerHTML=fields.map(f=>f.type==='tip'?`<div class="tip">${f.html}</div>`:field(f)).join('');
  mask.classList.add('on');m.classList.add('on');
  document.getElementById('msave').onclick=()=>{
    const fd=new FormData(document.getElementById('mform')),data={};
    fields.forEach(f=>{if(f.type==='tip')return;let v=fd.get(f.key);data[f.key]=f.type==='number'?Math.max(0,num(v)):(v??'').toString().trim()});
    if(onSave(data)!==false)closeModal();
  };
}
function closeModal(){document.getElementById('modal').classList.remove('on');document.getElementById('mask').classList.remove('on')}
function openAdd(){
  modal('新增什么？',[{type:'tip',html:'选择要新增的类别'}],()=>{});
  document.getElementById('mform').innerHTML=`<div style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px">${Object.keys(MODULES).map(k=>`<button class="btn g" style="justify-content:flex-start;padding:14px;" onclick="closeModal();openItem('${k}')">＋ ${MODULES[k]}</button>`).join('')}<button class="btn g" style="justify-content:flex-start;padding:14px;" onclick="closeModal();addChange()">＋ 其他费用</button><button class="btn g" style="justify-content:flex-start;padding:14px;" onclick="closeModal();addStage()">＋ 施工阶段</button></div>`;
  document.getElementById('msave').style.display='none';
}

function openItem(m,id, defaultData = {}){
  const it=id?S.items.find(i=>i.id===id):null;
  const base=it || Object.assign({module:m,room:'全屋',status:'待下单'}, defaultData);
  const isCustom=base.module==='custom';
  const isAppliance=base.module==='appliance';
  const isHouse=base.module==='house';
  const isLabor=base.module==='labor';
  const moduleOptions = Object.keys(MODULES).map(k => ({ value: k, label: MODULES[k] }));

  const fields=[
    {key:'name',label:'项目名称',type:'text',value:base.name||'',span:true,ph:isHouse?'例如：交首付款':(isLabor?'例如：水电工钱':'例如：冰箱 / 沙发')},
    {key:'module',label:'模块',type:'select',value:base.module,options:moduleOptions},
    {key:'amount',label:'实际花费',type:'number',value:base.amount || base.paid || ''},
    {key:'payer',label:'支付人',type:'text',value:base.payer||'',span:true,placeholder:'例如：老公 / 老婆'},
    {key:'note',label:'备注',type:'textarea',value:base.note||'',span:true}
  ];

  if (isHouse) fields.splice(1, 0, {key:'houseType',label:'购房子项',type:'select',value:base.houseType||'首付款',options:HOUSE_TYPES});
  else if (isLabor) {
    fields.splice(1, 0, {key:'laborType',label:'人工工种',type:'select',value:base.laborType||'水电工',options:LABOR_TYPES});
    fields.splice(2, 0, {key:'status',label:'状态',type:'select',value:base.status||'待下单',options:STATUS});
  } else {
    const roomOpts = ROOMS.map(r => ({value:r, label:`${ROOM_ICONS[r]||'🏷️'} ${r}`}));
    fields.splice(2, 0, {key:'room',label:'房间',type:'select',value:base.room||'全屋',options:roomOpts});
    fields.splice(3, 0, {key:'brand',label:'品牌/商家',type:'text',value:base.brand||''});
    fields.splice(4, 0, {key:'channel',label:'购买途径',type:'select',value:base.channel||'线下实体店',options:CHANNELS});
    fields.splice(5, 0, {key:'status',label:'状态',type:'select',value:base.status||'待下单',options:STATUS});
    if(isAppliance) fields.splice(4, 0, {key:'applianceType',label:'家电类型',type:'select',value:base.applianceType||'普通家电',options:APPLIANCE_TYPES});
    if(isCustom) {
      fields.push({key:'cabinet',label:'柜体类型',type:'select',value:base.cabinet||'衣柜',options:['衣柜','橱柜','书柜','鞋柜','电视柜','餐边柜','榻榻米','其他']});
      fields.push({key:'board',label:'板材',type:'select',value:base.board||'颗粒板',options:['颗粒板','多层实木板','生态板','密度板','实木','进口板材','其他']});
      fields.push({key:'area',label:'面积(㎡)',type:'number',value:base.area||''});
      fields.push({key:'unitPrice',label:'单价(元/㎡)',type:'number',value:base.unitPrice||''});
    } else {
      fields.push({key:'spec',label:'规格/型号',type:'text',value:base.spec||''});
      fields.push({key:'qty',label:'数量',type:'number',value:base.qty||''});
      fields.push({key:'unitPrice',label:'单价',type:'number',value:base.unitPrice||''});
    }
  }
  
  modal(id?'编辑项目':'新增项目',fields,data=>{
    if(!data.name){toast('请填写名称');return false}
    if(!num(data.amount)&&num(data.area)&&num(data.unitPrice))data.amount=num(data.area)*num(data.unitPrice);
    if(!num(data.amount)&&num(data.qty)&&num(data.unitPrice))data.amount=num(data.qty)*num(data.unitPrice);
    data.amount = num(data.amount); data.paid = data.amount;
    if(isHouse && !data.status) data.status = '已完成';
    if(id)Object.assign(it,data);else S.items.push(Object.assign({id:uid()},data));
    save();toast('已保存');
  });
  document.getElementById('msave').style.display='';
}

function editItem(id){const it=S.items.find(i=>i.id===id);if(it)openItem(it.module,id)}

function closeConfirm(){document.getElementById('confirmModal').classList.remove('on');}
function delItem(id){
  const it=S.items.find(i=>i.id===id);
  if(!it) return;
  document.getElementById('confirmMsg').innerHTML = `确定要删除「${it.name}」吗？<br>删除后将无法恢复。`;
  document.getElementById('confirmModal').classList.add('on');
  document.getElementById('confirmBtn').onclick = () => {
    S.items=S.items.filter(i=>i.id!==id); save(); toast('已删除'); closeConfirm();
  };
}

function openBudget(){
  modal('调整预算',[
    {type:'tip',html:'修改下方分类金额后，总预算将自动累加计算。'},
    {key:'total',label:'总投入 (自动累加)',type:'number',value:S.budget.total,span:true},
    {key:'c1',label:'购房费用',type:'number',value:S.budget.cats[0].amount},
    {key:'c2',label:'硬装',type:'number',value:S.budget.cats[1].amount},
    {key:'c3',label:'软装',type:'number',value:S.budget.cats[2].amount},
    {key:'c4',label:'家电',type:'number',value:S.budget.cats[3].amount}
  ],d=>{
    S.budget.cats[0].amount=num(d.c1); S.budget.cats[1].amount=num(d.c2); S.budget.cats[2].amount=num(d.c3); S.budget.cats[3].amount=num(d.c4);
    S.budget.total = S.budget.cats.reduce((sum, cat) => sum + cat.amount, 0);
    save();toast('总预算已自动更新！');
  });
  document.getElementById('msave').style.display='';
}
function editStage(id){const s=S.schedule.find(x=>x.id===id);modal('编辑阶段',[{key:'name',label:'阶段名称',type:'text',value:s.name,span:true},{key:'status',label:'状态',type:'select',value:s.status,options:['未开始','进行中','已完成']},{key:'start',label:'开始日期',type:'date',value:s.start||''},{key:'end',label:'结束日期',type:'date',value:s.end||''},{key:'note',label:'备注',type:'textarea',value:s.note||'',span:true}],d=>{Object.assign(s,d);save();toast('已更新')});document.getElementById('msave').style.display=''}
function addStage(){modal('新增阶段',[{key:'name',label:'阶段名称',type:'text',value:'',span:true},{key:'status',label:'状态',type:'select',value:'未开始',options:['未开始','进行中','已完成']},{key:'start',label:'开始日期',type:'date',value:''},{key:'end',label:'结束日期',type:'date',value:''},{key:'note',label:'备注',type:'textarea',value:'',span:true}],d=>{if(!d.name){toast('请填写名称');return false}S.schedule.push(Object.assign({id:uid()},d));save();toast('已新增')});document.getElementById('msave').style.display=''}
function addChange(){modal('新增其他费用',[
  {key:'name',label:'费用明细',type:'text',value:'',span:true,placeholder:'例如：打孔费 / 搬运费'},
  {key:'amount',label:'金额',type:'number',value:'',span:true},
  {key:'payer',label:'支付人',type:'text',value:'',span:true,placeholder:'例如：老公 / 老婆'}
],d=>{
  if(!d.name){toast('请填写明细');return false}
  S.changes.push({id:uid(), name:d.name, amount:num(d.amount), payer:d.payer, note:'', status:'已确认', room:'全屋'}); save();toast('已保存')
});document.getElementById('msave').style.display=''}
function editChange(id){const c=S.changes.find(x=>x.id===id);modal('编辑其他费用',[
  {key:'name',label:'费用明细',type:'text',value:c.name,span:true},
  {key:'amount',label:'金额',type:'number',value:c.amount||'',span:true},
  {key:'payer',label:'支付人',type:'text',value:c.payer||'',span:true}
],d=>{Object.assign(c,d);save();toast('已保存')});document.getElementById('msave').style.display=''}
function delChange(id){
  const it=S.changes.find(i=>i.id===id);
  if(!it) return;
  document.getElementById('confirmMsg').innerHTML = `确定要删除「${it.name}」吗？<br>删除后将无法恢复。`;
  document.getElementById('confirmModal').classList.add('on');
  document.getElementById('confirmBtn').onclick = () => {
    S.changes=S.changes.filter(x=>x.id!==id); save(); toast('已删除'); closeConfirm();
  };
}

function exportCSV(){
  const t=calc(),lines=[];
  const push=a=>lines.push(a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));
  push(['HOME · 我的理想家']);push(['导出时间',new Date().toLocaleString('zh-CN')]);push([]);
  push(['【项目明细】']);push(['模块','子项/工种','名称','房间','品牌','途径','家电类型','金额','支付人','状态','备注']);
  S.items.forEach(i=>push([MODULES[i.module],i.houseType||i.laborType||'',i.name,i.room||'',i.brand||'',i.channel||'',i.applianceType||'',num(i.amount),i.payer||'',i.status,i.note||'']));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `购房装修数据_${today()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('CSV已导出');
}
function showMore(){
  if(confirm('更多操作：\n1. 导出CSV\n2. 手动拉取云端数据\n3. 调整预算\n\n输入序号执行')){
    const n=parseInt(prompt('输入 1/2/3'));
    if(n===1)exportCSV(); if(n===2)cloudRefresh(); if(n===3)openBudget();
  }
}

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b && b.dataset.tab){tab=b.dataset.tab;roomFocus=null;render();window.scrollTo({top:0})}});
document.getElementById('renoSubMenu').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b && b.dataset.tab){tab=b.dataset.tab;roomFocus=null;render();window.scrollTo({top:0})}});
document.querySelectorAll('.bn[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;roomFocus=null;render();window.scrollTo({top:0})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeConfirm();}});
</script>
</body>
