<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>HOME · 我的理想家</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的理想家">
<link rel="apple-touch-icon" href="https://api.iconify.design/noto:house-with-garden.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7F2;--card:#fff;--ink:#2E2A26;--ink2:#6B6259;--ink3:#A2988D;--line:#EFE8DD;--wood:#B08968;--wood-d:#8C6A4F;--cream:#F5EEE4;--green:#6E9276;--red:#BF6A5C;--r:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;outline:none}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#C9A886,#9C7657);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:18px}
.bname{font-family:Georgia,serif;font-size:16px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tab{padding:7px 13px;border-radius:99px;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--wood);border-color:var(--wood);color:#fff}
.hero{background:linear-gradient(135deg,#FFFDFA,#F7EEE2 60%,#F0E2CF);border:1px solid #EFE3D3;border-radius:20px;padding:24px 20px;margin-bottom:14px}
.hero h1{font-family:Georgia,serif;font-size:26px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.stat .l{font-size:11px;color:var(--ink3)}
.stat .v{font-size:20px;font-weight:600;margin-top:7px}
.stat.acc{background:linear-gradient(145deg,#B08968,#96704F);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ct{font-size:12.5px;font-weight:600;margin-bottom:14px;border-left:3px solid var(--wood);padding-left:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 15px;border-radius:11px;font-size:13px;font-weight:500}
.btn.p{background:var(--wood);color:#fff}
.btn.g{border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn.t{padding:5px 10px;font-size:11.5px;border-radius:8px;border:1px solid var(--line);background:#fff}
.btn.x{padding:5px 10px;font-size:11.5px;border-radius:8px;background:#FBEDEB;color:var(--red)}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.mini{display:flex;gap:18px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 16px;margin-bottom:13px}
.mini span{font-size:10.5px;color:var(--ink3);display:block}
.mini b{font-size:15px}
.rec{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:8px;flex-wrap:wrap}
.rec .l{flex:1;min-width:0}
.rec .t{font-weight:600;font-size:14px}
.rec .m{font-size:11px;color:var(--ink3)}
.rec .a{font-weight:600;font-size:14px}
.rec .st{font-size:10.5px;padding:3px 9px;border-radius:99px;background:var(--cream)}
.tbl{overflow-x:auto;border-radius:13px;border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:11px 13px;border-bottom:1px solid #F6F1E9;text-align:left}
th{font-size:11px;color:var(--ink3);background:#FCFAF6}
td.n,th.n{text-align:right}
.over{color:var(--red)}
#mask{display:none;position:fixed;inset:0;background:rgba(46,42,38,.34);z-index:200}
#mask.on{display:block}
#modal{display:none;position:fixed;z-index:201;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:86vh;flex-direction:column;background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
#modal.on{display:flex}
.mh{display:flex;justify-content:space-between;padding:18px 20px 12px;font-size:17px;font-weight:600}
.mb{padding:0 20px 8px;overflow-y:auto;flex:1}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f{display:flex;flex-direction:column;gap:5px}
.f.s2{grid-column:1/-1}
.f span{font-size:11px;color:var(--ink3)}
.f input,.f select,.f textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#FDFCFA}
.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:90;padding:8px 6px;justify-content:space-around}
.bn{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--ink3);padding:4px 10px}
.bn.on{color:var(--wood-d)}
.fab{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#C9A886,#9C7657);color:#fff;display:grid;place-items:center;font-size:23px;margin-top:-16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:rgba(46,42,38,.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:300}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark">H</div><div class="bname">我的理想家</div></div>
    <div class="ops">
      <button class="btn g" onclick="cloudRefresh()">☁ 刷新</button>
      <button class="btn g" onclick="exportCSV()">导出CSV</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="home">总览</button>
    <button class="tab" data-tab="budget">预算</button>
    <button class="tab" data-tab="custom">全屋定制</button>
    <button class="tab" data-tab="appliance">家电</button>
    <button class="tab" data-tab="furniture">家具软装</button>
    <button class="tab" data-tab="material">主材辅材</button>
    <button class="tab" data-tab="progress">施工进度</button>
    <button class="tab" data-tab="changes">增项</button>
    <button class="tab" data-tab="rooms">房间</button>
  </div>
  <div id="view"></div>
</div>
<div class="bnav">
  <div class="bn on" data-tab="home"><span>🏠</span>首页</div>
  <div class="bn" data-tab="budget"><span>📊</span>预算</div>
  <div class="fab" onclick="openAdd()">＋</div>
  <div class="bn" data-tab="progress"><span>📅</span>进度</div>
  <div class="bn" onclick="showMore()"><span>☰</span>更多</div>
</div>
<div id="mask" onclick="closeModal()"></div>
<div id="modal">
  <div class="mh"><span id="mtitle">新增</span><button onclick="closeModal()" style="font-size:14px;color:#999">✕</button></div>
  <div class="mb"><form id="mform" class="form" autocomplete="off"></form></div>
  <div class="mf"><button class="btn g" onclick="closeModal()">取消</button><button class="btn p" id="msave">保存</button></div>
</div>
<div id="toast"></div>
<script>
const SUPABASE_URL = 'https://xzqemukyazhwoqmqvogf.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_g-N80wXBYPxEcAx05wGLBw_p27Al2DC';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const KEY='home_reno_cloud_v1';
const ROOMS=['全屋','玄关','客厅','餐厅','厨房','主卧','次卧','儿童房','书房','主卫','次卫','阳台','储物间','未分类'];
const MODULES={custom:'全屋定制',appliance:'家电采购',furniture:'家具软装',material:'主材辅材'};
const STATUS=['待下单','已下单','已付款','已到货','已安装','已完成'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmt=n=>'¥'+Math.round(num(n)).toLocaleString('zh-CN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

function def(){return{
  updatedAt:0,
  meta:{title:'我的理想家',status:'装修进行中',area:'150–200㎡',type:'毛坯房全屋装修'},
  budget:{total:300000,cats:[{name:'全屋定制',amount:130000,mods:['custom']},{name:'其他装修及采购',amount:150000,mods:['appliance','furniture','material']},{name:'预备金',amount:20000,mods:[]}]},
  items:[],changes:[],
  schedule:['拆改','水电','泥瓦','木工','油漆','安装','保洁','竣工'].map(n=>({id:uid(),name:n,status:'未开始',start:'',end:'',note:''}))
}}
let S=def(),tab='home',roomFocus=null;

function loadLocal(){try{const r=localStorage.getItem(KEY);return r?Object.assign(def(),JSON.parse(r)):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

async function cloudLoad(){
  try{ const { data, error } = await db.from('reno_data').select('content').eq('id', 1).single(); return data?data.content:null; }catch(e){return null}
}
async function cloudPush(){
  try{ await db.from('reno_data').update({ content: S }).eq('id', 1); return true; }catch(e){return false}
}
function save(){
  S.updatedAt=Date.now(); saveLocal(); render();
  cloudPush().then(ok=>{if(!ok)toast('云端同步失败')});
}
async function cloudRefresh(){
  toast('同步中…'); const remote=await cloudLoad();
  if(!remote){toast('拉取失败');return}
  if((remote.updatedAt||0)>(S.updatedAt||0)){ S=Object.assign(def(),remote); saveLocal(); render(); toast('已同步最新'); }
  else{ toast('已是最新'); }
}

async function init(){
  const local=loadLocal(); if(local) S=Object.assign(def(),local);
  const remote=await cloudLoad();
  if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){ S=Object.assign(def(),remote); saveLocal(); }
  else if(!remote||!remote.meta){ await cloudPush(); }
  render();
  db.channel('reno-sync').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'reno_data' }, payload => {
    if (payload.new && payload.new.content) {
      const rd = payload.new.content;
      if ((rd.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(def(), rd); saveLocal(); render(); }
    }
  }).subscribe();
}

function itemsBy(m){return S.items.filter(i=>i.module===m)}
function paid(i){return num(i.paid)}
function calc(){
  let c=0,p=0,arr=0;
  S.items.forEach(i=>{c+=num(i.amount);p+=paid(i);if(['已到货','已安装','已完成'].includes(i.status))arr++});
  const ch=S.changes.filter(x=>x.status==='已确认').reduce((s,x)=>s+num(x.amount),0);
  const total=p+ch;
  return{budget:num(S.budget.total),contract:c,total,changes:ch,remaining:num(S.budget.total)-total,pending:Math.max(c-p,0),arrived:arr}
}
function catPaid(cat){return S.items.filter(i=>cat.mods.includes(i.module)).reduce((s,i)=>s+paid(i),0)}
function catContract(cat){return S.items.filter(i=>cat.mods.includes(i.module)).reduce((s,i)=>s+num(i.amount),0)}

function render(){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.querySelectorAll('.bn[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=document.getElementById('view');
  if(tab==='home')v.innerHTML=home();
  else if(tab==='budget')v.innerHTML=budget();
  else if(tab==='progress')v.innerHTML=progress();
  else if(tab==='changes')v.innerHTML=changes();
  else if(tab==='rooms')v.innerHTML=rooms();
  else v.innerHTML=moduleView(tab);
}

function home(){
  const t=calc(),m=S.meta, pct=t.budget?Math.min(100,t.total/t.budget*100):0;
  const bars=S.budget.cats.map(c=>{
    const u=catPaid(c),p=c.amount?Math.min(100,u/c.amount*100):0,over=u>c.amount;
    return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span>${esc(c.name)}</span><b>${fmt(c.amount)}</b></div><div style="height:7px;border-radius:99px;background:var(--cream);overflow:hidden"><i style="display:block;height:100%;width:${p}%;background:${over?'var(--red)':'var(--wood)'}"></i></div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:5px"><span>已付 ${fmt(u)}</span><span>${p.toFixed(0)}%</span></div></div>`
  }).join('');
  return `<div class="hero"><div style="font-size:9.5px;letter-spacing:.2em;color:var(--wood);font-weight:600">HOME RENOVATION</div><h1>${esc(m.title)}</h1><div style="font-size:12.5px;color:var(--ink2);margin-top:9px">${esc(m.status)} · ${esc(m.area)}</div><div class="ops" style="margin-top:14px"><button class="btn p" onclick="openAdd()">＋ 新增支出</button><button class="btn g" onclick="openBudget()">调整预算</button></div><div style="margin-top:10px;font-size:10.5px;color:var(--green)">● 云端已连接 (支持共享)</div></div>
  <div class="grid">
    <div class="stat acc"><div class="l">装修总预算</div><div class="v">${fmt(t.budget)}</div></div>
    <div class="stat"><div class="l">累计实际支出</div><div class="v ${t.total?'':'sm'}">${t.total?fmt(t.total):'待录入'}</div></div>
    <div class="stat"><div class="l">剩余可用预算</div><div class="v ${t.remaining<0?'over':''}">${t.remaining?fmt(t.remaining):'待录入'}</div></div>
    <div class="stat"><div class="l">待付款金额</div><div class="v">${fmt(t.pending)}</div></div>
    <div class="stat"><div class="l">已到货项目</div><div class="v">${t.arrived} 项</div></div>
  </div>
  <div class="card"><div class="ct">预算使用概览 (已使用 ${pct.toFixed(0)}%)</div><div style="height:9px;border-radius:99px;background:var(--cream);overflow:hidden;margin-bottom:8px"><i style="display:block;height:100%;width:${pct}%;background:${t.remaining<0?'var(--red)':'var(--wood)'}"></i></div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3)"><span>已支出 ${fmt(t.total)}</span><span>剩余 ${fmt(t.remaining)}</span></div></div>
  <div class="card"><div class="ct">分项预算</div>${bars}</div>`;
}

function budget(){
  const t=calc();
  const rows=S.budget.cats.map(c=>{const u=catPaid(c),con=catContract(c),rest=c.amount-u;return `<tr><td><b>${esc(c.name)}</b></td><td class="n">${fmt(c.amount)}</td><td class="n">${fmt(con)}</td><td class="n">${fmt(u)}</td><td class="n ${rest<0?'over':''}">${fmt(rest)}</td></tr>`}).join('');
  const mods=Object.keys(MODULES).map(k=>{const l=itemsBy(k),c=l.reduce((s,i)=>s+num(i.amount),0),p=l.reduce((s,i)=>s+paid(i),0);return `<tr><td>${MODULES[k]}</td><td class="n">${l.length}</td><td class="n">${fmt(c)}</td><td class="n">${fmt(p)}</td><td class="n">${fmt(Math.max(c-p,0))}</td></tr>`}).join('');
  return `<div class="head"><div><div style="font-size:9.5px;color:var(--wood)">BUDGET</div><h2>装修预算中心</h2></div><button class="btn p" onclick="openAdd()">＋ 新增支出</button></div>
  <div class="grid"><div class="stat acc"><div class="l">总预算</div><div class="v">${fmt(t.budget)}</div></div><div class="stat"><div class="l">合同金额</div><div class="v">${fmt(t.contract)}</div></div><div class="stat"><div class="l">实际支出</div><div class="v">${fmt(t.total)}</div></div><div class="stat"><div class="l">剩余可用</div><div class="v ${t.remaining<0?'over':''}">${fmt(t.remaining)}</div></div></div>
  <div class="card"><div class="ct">分项预算</div><div class="tbl"><table><thead><tr><th>分类</th><th class="n">规划</th><th class="n">合同</th><th class="n">已付</th><th class="n">剩余</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="card"><div class="ct">按模块</div><div class="tbl"><table><thead><tr><th>模块</th><th class="n">条目</th><th class="n">合同</th><th class="n">已付</th><th class="n">待付</th></tr></thead><tbody>${mods}</tbody></table></div></div>`;
}

function moduleView(m){
  const l=itemsBy(m),c=l.reduce((s,i)=>s+num(i.amount),0),p=l.reduce((s,i)=>s+paid(i),0);
  const rec=l.map(i=>`<div class="rec"><div class="l"><div class="t">${esc(i.name)}</div><div class="m">${esc(i.room||'未分类')} · ${esc(i.brand||'')}</div></div><div class="r"><div class="a">${fmt(i.amount)}</div><div class="m">已付 ${fmt(paid(i))}</div></div><div class="st">${esc(i.status||'待下单')}</div><div class="ops"><button class="btn t" onclick="editItem('${i.id}')">编辑</button><button class="btn x" onclick="delItem('${i.id}')">删除</button></div></div>`).join('');
  return `<div class="head"><div><div style="font-size:9.5px;color:var(--wood)">${MODULES[m]}</div><h2>${MODULES[m]}</h2></div><button class="btn p" onclick="openItem('${m}')">＋ 新增</button></div>
  <div class="mini"><div><span>合同金额</span><b>${fmt(c)}</b></div><div><span>已付款</span><b>${fmt(p)}</b></div><div><span>待付款</span><b>${fmt(Math.max(c-p,0))}</b></div></div>
  ${l.length?rec:`<div style="text-align:center;padding:38px;color:#999">暂无记录</div>`}`;
}

function progress(){
  const l=S.schedule.map(s=>`<div class="rec"><div class="l"><div class="t">${esc(s.name)}</div></div><div class="st">${esc(s.status)}</div><div class="ops"><button class="btn t" onclick="editStage('${s.id}')">编辑</button></div></div>`).join('');
  return `<div class="head"><div><div style="font-size:9.5px;color:var(--wood)">SCHEDULE</div><h2>施工进度</h2></div></div>${l}`;
}

function changes(){
  const l=S.changes.map(c=>`<div class="rec"><div class="l"><div class="t">${esc(c.name)}</div><div class="m">${esc(c.room||'全屋')}</div></div><div class="r"><div class="a">${fmt(c.amount)}</div></div><div class="st">${esc(c.status||'待确认')}</div><div class="ops"><button class="btn t" onclick="editChange('${c.id}')">编辑</button><button class="btn x" onclick="delChange('${c.id}')">删除</button></div></div>`).join('');
  return `<div class="head"><div><div style="font-size:9.5px;color:var(--wood)">CHANGE</div><h2>装修增项</h2></div><button class="btn p" onclick="addChange()">＋ 新增增项</button></div>${S.changes.length?l:`<div style="text-align:center;padding:38px;color:#999">暂无增项</div>`}`;
}

function rooms(){
  const map={};
  S.items.forEach(i=>{const r=i.room||'未分类';if(!map[r])map[r]={a:0,p:0,n:0,list:[]};map[r].a+=num(i.amount);map[r].p+=paid(i);map[r].n++;map[r].list.push(i)});
  const keys=Object.keys(map).sort((a,b)=>map[b].a-map[a].a);
  const cards=keys.map(r=>`<div class="card" style="padding:14px;cursor:pointer" onclick="focusRoom('${esc(r)}')"><div style="font-size:13px;font-weight:600">${esc(r)}</div><div style="font-size:16px;font-weight:600;color:var(--wood-d);margin-top:6px">${fmt(map[r].a)}</div><div style="font-size:10.5px;color:var(--ink3);margin-top:2px">${map[r].n} 项</div></div>`).join('');
  let detail='';
  if(roomFocus&&map[roomFocus]){
    const rows=map[roomFocus].list.map(i=>`<tr><td>${esc(i.name)}</td><td>${MODULES[i.module]}</td><td class="n">${fmt(i.amount)}</td><td class="n">${fmt(paid(i))}</td></tr>`).join('');
    detail=`<div class="card"><div class="ct">${esc(roomFocus)} 明细</div><div class="tbl"><table><thead><tr><th>项目</th><th>模块</th><th class="n">金额</th><th class="n">已付</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return `<div class="head"><div><div style="font-size:9.5px;color:var(--wood)">BY ROOM</div><h2>房间费用</h2></div></div><div class="grid">${cards}</div>${detail}`;
}
function focusRoom(r){roomFocus=roomFocus===r?null:r;render()}

function openModal(title,fields,onSave){
  const m=document.getElementById('modal'),mask=document.getElementById('mask');
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mform').innerHTML=fields.map(f=>{
    const cls=f.span?'f s2':'f';
    let input=`<input name="${f.key}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.type==='number'?'min="0"':''}>`;
    if(f.type==='select') input=`<select name="${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${f.value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    return `<label class="${cls}"><span>${esc(f.label)}</span>${input}</label>`;
  }).join('');
  mask.classList.add('on');m.classList.add('on');
  document.getElementById('msave').onclick=()=>{
    const fd=new FormData(document.getElementById('mform')),data={};
    fields.forEach(f=>{let v=fd.get(f.key);data[f.key]=f.type==='number'?Math.max(0,num(v)):(v??'').toString().trim()});
    if(onSave(data)!==false) closeModal();
  };
}
function closeModal(){document.getElementById('modal').classList.remove('on');document.getElementById('mask').classList.remove('on')}

function openAdd(){openItem('appliance')}
function openItem(m,id){
  const base=id?S.items.find(i=>i.id===id):{module:m,room:'全屋',status:'待下单'};
  openModal(id?'编辑项目':'新增项目',[
    {key:'name',label:'名称',value:base.name||'',span:true},
    {key:'module',label:'模块',type:'select',value:base.module,options:Object.keys(MODULES)},
    {key:'room',label:'房间',type:'select',value:base.room||'全屋',options:ROOMS},
    {key:'brand',label:'商家',value:base.brand||''},
    {key:'status',label:'状态',type:'select',value:base.status||'待下单',options:STATUS},
    {key:'amount',label:'合同金额',type:'number',value:base.amount||''},
    {key:'paid',label:'已付款',type:'number',value:base.paid||0}
  ],d=>{
    if(!d.name){toast('填名称');return false}
    if(id)Object.assign(base,d);else S.items.push(Object.assign({id:uid()},d));
    save();toast('已保存');
  });
}
function editItem(id){const it=S.items.find(i=>i.id===id);if(it)openItem(it.module,id)}
function delItem(id){if(confirm('删除？')){S.items=S.items.filter(i=>i.id!==id);save()}}

function openBudget(){
  openModal('调整预算',[
    {key:'total',label:'总预算',type:'number',value:S.budget.total,span:true},
    {key:'c1',label:'全屋定制',type:'number',value:S.budget.cats[0].amount},
    {key:'c2',label:'其他采购',type:'number',value:S.budget.cats[1].amount}
  ],d=>{S.budget.total=num(d.total);S.budget.cats[0].amount=num(d.c1);S.budget.cats[1].amount=num(d.c2);save();toast('已更新')});
}
function editStage(id){
  const s=S.schedule.find(x=>x.id===id);
  openModal('编辑阶段',[
    {key:'name',label:'名称',value:s.name,span:true},
    {key:'status',label:'状态',type:'select',value:s.status,options:['未开始','进行中','已完成']},
    {key:'note',label:'备注',value:s.note||'',span:true}
  ],d=>{Object.assign(s,d);save();toast('已保存')});
}
function addChange(){
  openModal('新增增项',[
    {key:'name',label:'名称',value:'',span:true},
    {key:'room',label:'房间',type:'select',value:'全屋',options:ROOMS},
    {key:'amount',label:'金额',type:'number',value:''},
    {key:'status',label:'状态',type:'select',value:'待确认',options:['待确认','已确认','已取消']}
  ],d=>{if(!d.name){toast('填名称');return false}S.changes.push(Object.assign({id:uid()},d));save();toast('已保存')});
}
function editChange(id){
  const c=S.changes.find(x=>x.id===id);
  openModal('编辑增项',[
    {key:'name',label:'名称',value:c.name,span:true},
    {key:'room',label:'房间',type:'select',value:c.room,options:ROOMS},
    {key:'amount',label:'金额',type:'number',value:c.amount},
    {key:'status',label:'状态',type:'select',value:c.status,options:['待确认','已确认','已取消']}
  ],d=>{Object.assign(c,d);save();toast('已保存')});
}
function delChange(id){if(confirm('删除？')){S.changes=S.changes.filter(x=>x.id!==id);save()}}

function exportCSV(){
  const t=calc(),lines=[];
  const push=a=>lines.push(a.join(','));
  push(['HOME我的理想家']);push(['导出时间',new Date().toLocaleString()]);push([]);
  push(['【预算】']);push(['分类','规划','合同','已付']);
  S.budget.cats.forEach(c=>push([c.name,c.amount,catContract(c),catPaid(c)]));
  push([]);push(['【项目】']);push(['模块','名称','房间','金额','已付']);
  S.items.forEach(i=>push([MODULES[i.module],i.name,i.room,num(i.amount),paid(i)]));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`装修数据_${today()}.csv`;a.click();
}

document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.tab;roomFocus=null;render();window.scrollTo(0,0)}};
document.querySelectorAll('.bn[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;roomFocus=null;render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
init();
</script>
